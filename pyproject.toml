[project]
name = "ucsc-student-services"
version = "1.0.0"
description = "UC Santa Cruz Student Services — ADK 2.0 Multi-Agent Demo with RAG + Google Search Grounding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.3.0",
    "google-cloud-aiplatform>=1.60.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]",
]
deploy = [
    "google-cloud-aiplatform>=1.60.0",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json"]
